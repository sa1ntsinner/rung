id = "siemens-scl"
name = "Siemens SCL"
version = "0.3.0"
schema_version = 1
authors = ["Elmir Mirzayev"]
description = "Siemens SCL for TIA Portal projects with the rung language server: completion, definitions, references, rename, TIA compile errors on their line, run buttons for compile, test and download, and snippets. Uses rung from PATH, or installs it from npm (@rung-plc/cli)."
repository = "https://github.com/sa1ntsinner/rung"
snippets = ["./snippets/scl.json"]

# Structured Text itself comes from the Structured Text extension; the language server serves it too
[language_servers.rung]
name = "rung"
languages = ["SCL", "Structured Text"]

[grammars.scl]
repository = "https://github.com/sa1ntsinner/rung"
rev = "e5d5bdcc3b8b921f9ef18321a3950beb0ea5cb76"
path = "grammars/tree-sitter-scl"
