# SPDX-License-Identifier: MIT
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
  bridge-core:
    # Public CI builds only the Siemens-free core. The Openness adapter is built on a trusted host with TIA installed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, framework: net48 }
          - { os: windows-latest, framework: net10.0 }
          - { os: ubuntu-latest, framework: net10.0 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: bridge/global.json }
      - run: dotnet test bridge/tests/Rung.Bridge.Core.Tests/Rung.Bridge.Core.Tests.csproj -f ${{ matrix.framework }}
