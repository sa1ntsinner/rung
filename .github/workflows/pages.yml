# SPDX-License-Identifier: MIT
# Publishes site/ to GitHub Pages. Runs only once the repository is public
# (Pages on a private repository needs a paid plan) and Pages is set to "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
    # the playground runs the simulator itself: the site changes with it
    paths: ["site/**", "tools/site/**", "packages/sim/**", "packages/lsp/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node tools/site/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
