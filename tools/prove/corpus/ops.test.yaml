block: FB_ProveOps
cases:
  - name: small values
    steps:
      - set: { a: 7, b: 3, d: 100000, r: 2.5, w: 16#00F3, n: 5 }
        cycle: 1
  - name: negative division and rounding
    steps:
      - set: { a: -7, b: 2, d: -1, r: -2.5, w: 16#8001, n: 0 }
        cycle: 1
      - set: { a: -7, b: -2, r: 3.5 }
        cycle: 1
      - set: { a: 7, b: -2, r: -3.5 }
        cycle: 1
  - name: int overflow wraps around
    steps:
      - set: { a: 32767, b: 1, d: 2147483000, r: 1.5, w: 16#FFFF, n: 9 }
        cycle: 1
      - set: { a: -32768, b: -1, r: 0.49999 }
        cycle: 1
      - set: { a: 300, b: 200, r: 32767.4 }
        cycle: 1
  - name: case labels and limits
    steps:
      - set: { a: 20, b: 20, r: 0.0, w: 16#0008, n: 1 }
        cycle: 1
      - set: { a: -3, b: 150 }
        cycle: 1
      - set: { a: 200, b: -200 }
        cycle: 1
